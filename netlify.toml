[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Base path pour Netlify (généralement "/")
  VITE_BASE = "/"
  # Optionnel: URL publique (peut être définie dans le dashboard Netlify)
  # VITE_PUBLIC_BASE_URL = "https://<votre-site>.netlify.app"

# Les secrets sensibles (SingPay, Cloudinary) doivent être définis dans le dashboard Netlify
# Site settings > Environment variables — pour le paiement runtime :
#   SINGPAY_CLIENT_ID, SINGPAY_CLIENT_SECRET, SINGPAY_WALLET
# (les VITE_SINGPAY_* du build front ne suffisent pas toujours aux Functions)

# SPA fallback défini via public/_redirects (copié vers dist/_redirects au build) 

# Redirections explicites (Netlify)
[[redirects]]
  from = "https://www.nack.pro/*"
  to = "https://nack.pro/:splat"
  status = 301
  force = true

# Les fichiers /assets/* existants sont servis en priorité.
# Si un chunk hashé est absent (cache index.html obsolète), renvoyer 404
# au lieu de index.html — sinon le navigateur charge du HTML en MIME "module".
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Le menu digital public (/light/) doit toujours servir light/index.html
# et JAMAIS le fallback SPA React — sinon les clients voient la page de connexion.
[[redirects]]
  from = "/light"
  to = "/light/index.html"
  status = 200

[[redirects]]
  from = "/light/*"
  to = "/light/index.html"
  status = 200

# SPA fallback pour les routes internes React uniquement
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200