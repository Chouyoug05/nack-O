<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>NACK! - Plateforme de gestion gabonaise</title>
    <meta name="description" content="NACK! - Plateforme moderne de gestion pour bars, snacks et boîtes de nuit au Gabon" />
    <meta name="author" content="NACK!" />

    <!-- Favicon -->
    <link rel="icon" href="%BASE_URL%Design sans titre.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192x192.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="%BASE_URL%manifest.json">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#dc2626">
    <meta name="background-color" content="#ffffff">
    <meta name="display" content="standalone">
    <meta name="orientation" content="portrait-primary">
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="NACK!">
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-72x72.png" sizes="72x72">
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-96x96.png" sizes="96x96">
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-128x128.png" sizes="128x128">
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-144x144.png" sizes="144x144">
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-152x152.png" sizes="152x152">
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192x192.png" sizes="192x192">

    <!-- Android PWA Support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="NACK!">

    <!-- Open Graph -->
    <meta property="og:title" content="NACK! - Plateforme de gestion gabonaise" />
    <meta property="og:description" content="Gérez facilement votre établissement avec NACK!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%icons/icon-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nack_gabon" />
    <meta name="twitter:image" content="%BASE_URL%icons/icon-512x512.png" />
  </head>

  <body>
    <!--
      Détection appareils anciens (iPad 3 / iOS < 11, Safari < 11, pas de Promise.allSettled).
      Redirige VERS /light/ (plateforme native autonome) AVANT React / Tailwind / Radix.
    -->
    <script>
      (function () {
        try {
          var force = false;
          try {
            force = /[?&](?:light|legacy)=1(?:&|$)/.test(location.search) ||
              localStorage.getItem('nack_force_light') === '1' ||
              localStorage.getItem('nack_force_legacy') === '1';
          } catch (e) {}

          var legacy = force;

          // Aligné sur browserDetect.ts — vérifie les ES2015+ fondamentaux
          if (!legacy) {
            if (typeof Symbol === 'undefined' ||
                typeof Promise === 'undefined' ||
                typeof Array.prototype.find === 'undefined' ||
                typeof Array.prototype.includes === 'undefined' ||
                typeof Object.assign === 'undefined' ||
                typeof fetch === 'undefined' ||
                typeof indexedDB === 'undefined') {
              legacy = true;
            }
          }

          // Fallback UA : très vieux iOS ou Safari qui passent les checks mais plantent
          if (!legacy && typeof navigator !== 'undefined') {
            var ua = navigator.userAgent || '';
            var iosMatch = ua.match(/OS (\d+)[_.\d]*/i);
            if (iosMatch) {
              var iosMajor = parseInt(iosMatch[1], 10);
              if (iosMajor < 11) legacy = true;
            }
            var safariMatch = ua.match(/Version\/(\d+)/);
            if (safariMatch && /Safari/.test(ua) && !/Chrome/.test(ua) && !/CriOS/.test(ua)) {
              var safariMajor = parseInt(safariMatch[1], 10);
              if (safariMajor < 11) legacy = true;
            }
          }

          window.__NACK_LEGACY_BROWSER__ = !!legacy;

          if (legacy) {
            try { document.documentElement.className += ' legacy-browser'; } catch (e2) {}
            // Déjà dans /light/ → ne pas reboucler
            if (location.pathname.indexOf('/light') === -1) {
              var base = '%BASE_URL%';
              if (!base || base.indexOf('%') !== -1) base = '/';
              if (base.charAt(base.length - 1) !== '/') base += '/';
              location.replace(base + 'light/');
              return;
            }
          }
        } catch (err) {
          /* en cas d'échec de détection, on laisse le flux React */
        }
      })();
    </script>

    <!-- Fallback inline : visible tant que React ne se monte pas -->
    <div id="root">
      <div id="nack-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf8f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:1.5rem">
        <div>
          <img id="nack-fallback-logo" src="%BASE_URL%icons/icon-192x192.png" alt="NACK!" width="96" height="96" style="margin:0 auto 1rem;border-radius:20px;object-fit:contain" onerror="this.style.display='none';document.getElementById('nack-fallback-svg').style.display='block';" />
          <svg id="nack-fallback-svg" width="96" height="96" viewBox="0 0 48 48" fill="none" style="margin:0 auto 1rem;display:none">
            <rect width="48" height="48" rx="12" fill="#dc2626"/>
            <text x="24" y="32" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="sans-serif">N</text>
          </svg>
          <p style="color:#666;font-size:0.875rem">Chargement de NACK...</p>
        </div>
      </div>
    </div>

    <!-- Handler erreur critique : si JS échoue completement, on affiche un message -->
    <script>
      (function(){
        // Si déjà redirigé vers legacy, ne pas monter les timers React
        if (window.__NACK_LEGACY_BROWSER__ && location.pathname.indexOf('/light') !== -1) return;

        var timeout = setTimeout(function(){
          var fb = document.getElementById('nack-fallback');
          if(fb){
            fb.innerHTML = '<div><img src="%BASE_URL%icons/icon-192x192.png" alt="NACK!" width="96" height="96" style="margin:0 auto 1rem;border-radius:20px;object-fit:contain;display:block"><h2 style="font-size:1.125rem;margin-bottom:0.5rem">Impossible de charger NACK</h2><p style="color:#666;font-size:0.875rem;margin-bottom:1rem">Votre navigateur est trop ancien ou une erreur est survenue.</p><p style="margin-bottom:1rem"><a href="%BASE_URL%light/" style="color:#dc2626;font-weight:600">Ouvrir le mode léger</a></p><button onclick="window.location.reload()" style="padding:0.5rem 1.5rem;background:#dc2626;color:white;border:none;border-radius:0.375rem;cursor:pointer;font-size:0.875rem">Recharger</button></div>';
          }
        }, 20000);

        window.addEventListener('error', function(){
          // Si le timeout n\'est pas encore déclenché, on le garde
        });

        window.addEventListener('load', function(){
          // Ne supprimer le fallback QUE si React a monté (root a des enfants)
          clearTimeout(timeout);
          var root = document.getElementById('root');
          if (root && root.children.length > 1) { // >1 car nack-fallback est le premier enfant
            var fb = document.getElementById('nack-fallback');
            if(fb) setTimeout(function(){ fb.remove(); }, 500);
          } else {
            // React n'a pas monté — proposer le mode léger
            var fb2 = document.getElementById('nack-fallback');
            if(fb2) fb2.innerHTML = '<div><img src="%BASE_URL%icons/icon-192x192.png" alt="NACK!" width="96" height="96" style="margin:0 auto 1rem;border-radius:20px;object-fit:contain;display:block"><h2 style="font-size:1.125rem;margin-bottom:0.5rem">Erreur de chargement</h2><p style="color:#666;font-size:0.875rem;margin-bottom:1rem">Votre navigateur ne peut pas exécuter NACK. Essayez le mode léger.</p><p style="margin-bottom:1rem"><a href="%BASE_URL%light/" style="display:inline-block;padding:0.5rem 1.5rem;background:#dc2626;color:white;border-radius:0.375rem;text-decoration:none;font-size:0.875rem">Mode léger</a></p><button onclick="window.location.reload()" style="padding:0.5rem 1.5rem;background:transparent;color:#dc2626;border:1px solid #dc2626;border-radius:0.375rem;cursor:pointer;font-size:0.875rem">Recharger</button></div>';
          }
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
